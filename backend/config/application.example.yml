# Copy this file to config/application.yml (which git ignores) and fill in the password.
# Spring Boot reads ./config/application.yml automatically when the backend starts.

app:
  mail:
    from: Astute Funerals <astutefunerals@morokagroup.co.za>
    # New call-back requests, messages and online applications are emailed to this address
    # (leave empty to use the "from" address above; set alerts: false to switch them off).
    alerts-to: ""
  # Address suggestions on the application form. Free (OpenStreetMap) by default. To use Google instead, paste a
  # Google Maps Platform key with "Places API (New)" enabled, and set a daily quota on it to cap spending.
  address-search:
    google-api-key: ""
    # photon: false   # uncomment to switch the free suggestions off

spring:
  mail:
    host: mail.morokagroup.co.za
    port: 587
    username: astutefunerals@morokagroup.co.za
    password: ""
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
