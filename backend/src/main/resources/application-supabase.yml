# Settings for running against a Supabase PostgreSQL database.
# Activate with:  SPRING_PROFILES_ACTIVE=supabase
#
# Required environment variables (Supabase dashboard > Connect > "Session pooler"):
#   DB_URL       jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME  postgres.<your-project-ref>
#   DB_PASSWORD  your database password
#
# Use the SESSION pooler (port 5432), not the transaction pooler (port 6543): this app keeps
# long-lived connections and uses prepared statements, which transaction mode does not support.

spring:
  datasource:
    hikari:
      # Supabase limits connections per project; a small pool is plenty for this site.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 20000
      # Recycle connections before Supabase's pooler drops idle ones.
      max-lifetime: 600000
      idle-timeout: 300000
  jpa:
    properties:
      hibernate:
        # Keep the tables OUT of the "public" schema. Supabase automatically exposes "public"
        # through its REST API, which would put applicants' personal data at risk.
        default_schema: ${DB_SCHEMA:astute}
        hbm2ddl:
          create_namespaces: true
